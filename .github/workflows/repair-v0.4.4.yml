name: Repair ClipToBox v0.4.4 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair release v0.4.4]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify package
        run: |
          cat \
            .release/parts/part-00 \
            .release/parts/part-01 \
            .release/parts/part-02 \
            .release/parts/part-03 \
            .release/parts/part-04a \
            .release/parts/part-04b \
            .release/parts/part-05a \
            .release/parts/part-05b \
            > ClipToBox-v0.4.4-Edge.zip
          test "$(stat -c%s ClipToBox-v0.4.4-Edge.zip)" = "45429"
          echo "95628c60638e290bee8471d87cad543c24daa2274680863eb3430074b436071a  ClipToBox-v0.4.4-Edge.zip" | sha256sum -c -
          unzip -t ClipToBox-v0.4.4-Edge.zip

      - name: Replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.4.4 ClipToBox-v0.4.4-Edge.zip --clobber --repo "${{ github.repository }}"
