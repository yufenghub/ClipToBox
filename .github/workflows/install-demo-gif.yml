name: Install README demo GIF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-demo:
    if: contains(github.event.head_commit.message, '[install demo gif]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild demo GIF
        shell: bash
        run: |
          mkdir -p assets
          cat .demo-upload/part-00 .demo-upload/part-01 .demo-upload/part-02 .demo-upload/part-03 | base64 -d > assets/demo.gif
          echo "5b45eebcdf64ce88d0865364e47eebbcedb0941bc14125363d8483cffd1cfe47  assets/demo.gif" | sha256sum -c -
          test "$(wc -c < assets/demo.gif)" -eq 162007
      - name: Commit demo and remove temporary upload files
        shell: bash
        run: |
          rm -rf .demo-upload
          rm -f .github/workflows/install-demo-gif.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add ClipToBox demo GIF"
          git push
